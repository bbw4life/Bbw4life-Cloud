<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/maintenance-gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBW4LIFE — Your Preference</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bbw-gold: #B8925A;
    --bbw-rose: #6E2439;
    --col-dark: #15110E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, var(--col-dark));
    padding: 26px 18px 40px;
  }
  .logo {
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: var(--bbw-gold);
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    font-size: 13.5px;
    color: var(--tg-theme-hint-color, #7a7a7a);
    margin-bottom: 28px;
    line-height: 1.4;
  }
  .choices { display: flex; flex-direction: column; gap: 12px; }
  .choice-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    border-radius: 12px;
    border: 1.5px solid var(--tg-theme-hint-color, #d9d3ca);
    background: var(--tg-theme-secondary-bg-color, #f7f3ee);
    color: var(--tg-theme-text-color, var(--col-dark));
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
  }
  .choice-btn:disabled { opacity: 0.6; }
  .choice-btn .emoji { font-size: 22px; }
  .choice-btn--woman:active { border-color: var(--bbw-rose); }
  .choice-btn--man:active { border-color: var(--bbw-gold); }
  .msg { text-align: center; font-size: 13.5px; margin-top: 16px; min-height: 18px; }
  .msg.error { color: #c0392b; }
  .msg.success { color: #2e7d32; }
</style>
</head>
<body>

  <div class="logo">BBW4LIFE</div>
  <div class="subtitle">
    One last thing — so we can send you the right new arrivals.<br>
    Are you shopping for yourself as a Queen or a King?
  </div>

  <div class="choices">
    <button type="button" class="choice-btn choice-btn--woman" id="chooseWoman">
      <span class="emoji">👗</span> Woman
    </button>
    <button type="button" class="choice-btn choice-btn--man" id="chooseMan">
      <span class="emoji">👔</span> Man
    </button>
  </div>

  <div class="msg" id="formMsg"></div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  function getChatId() {
    var params = new URLSearchParams(window.location.search);
    var fromQuery = params.get('chat_id');
    if (fromQuery) return fromQuery;
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      return String(tg.initDataUnsafe.user.id);
    }
    return '';
  }

  var chatId = getChatId();
  var msgEl = document.getElementById('formMsg');
  var womanBtn = document.getElementById('chooseWoman');
  var manBtn = document.getElementById('chooseMan');

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = 'msg' + (type ? ' ' + type : '');
  }

  if (!chatId) {
    showMsg('Missing Telegram session — please reopen this from the bot.', 'error');
    womanBtn.disabled = true;
    manBtn.disabled = true;
  }

  function submitGender(gender) {
    womanBtn.disabled = true;
    manBtn.disabled = true;
    showMsg('Saving your preference…', '');

    fetch('/.netlify/functions/save-account', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'set_telegram_gender',
        telegramChatId: chatId,
        gender: gender
      })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.success) {
          showMsg('All set! You can close this window.', 'success');
          if (tg) { setTimeout(function () { tg.close(); }, 1500); }
        } else {
          showMsg((data && data.error) || 'Something went wrong. Please try again.', 'error');
          womanBtn.disabled = false;
          manBtn.disabled = false;
        }
      })
      .catch(function () {
        showMsg('Network error — please try again.', 'error');
        womanBtn.disabled = false;
        manBtn.disabled = false;
      });
  }

  womanBtn.addEventListener('click', function () { submitGender('woman'); });
  manBtn.addEventListener('click', function () { submitGender('man'); });
})();
</script>

</body>
</html>
