[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ─────────────────────────────────────────────
# DEV — dossier publié en local pour `netlify dev`. Sans ça, son serveur
# statique de secours ne détecte pas la racine et renvoie 403 Forbidden sur
# toute page dans un sous-dossier (products/, blog/, page/, collections/...),
# alors que la page d'accueil (racine) fonctionne. N'affecte pas le déploiement
# réel (le dossier publié en production reste géré depuis le dashboard Netlify).
# ─────────────────────────────────────────────
[dev]
  publish = "."

[build.environment]
  NODE_OPTIONS = "--no-deprecation"

[functions.environment]
  NODE_OPTIONS = "--no-deprecation"

[functions.retry-pending-order]
  schedule = "*/5 * * * *"
  background = true

[functions.detect-abandoned-cart]
  schedule = "*/10 * * * *"
  background = true

[functions.reply-contact-message]
  schedule = "*/5 * * * *"
  background = true

[functions."check-approved-stories"]
  schedule = "*/10 * * * *"
  background = true

[functions.process-email-queue]
  schedule = "* * * * *"
  background = true

[functions."send-cart-push-reminder"]
  schedule = "*/5 * * * *"
  background = true

[functions."send-telegram-new-arrivals"]
  schedule = "0 12 */3 * *"
  background = true

[functions."send-telegram-promo"]
  schedule = "0 12 */6 * *"
  background = true


# ─────────────────────────────────────────────
# CACHE — no-store interdit TOUTE mise en cache (navigateur + intermédiaires),
# pas seulement une revalidation optionnelle : chaque requête retélécharge le
# fichier depuis Netlify, garantissant que la dernière version déployée
# s'affiche automatiquement après un simple refresh, sans purge manuelle.
# ─────────────────────────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"

[[headers]]
  for = "/products.data.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"


# ─────────────────────────────────────────────
# PRODUCT FEED — Google Merchant / Meta / Pinterest / TikTok Shop
# ─────────────────────────────────────────────
[[redirects]]
  from = "/product-feed.xml"
  to = "/.netlify/functions/product-feed"
  status = 200
  force = true


